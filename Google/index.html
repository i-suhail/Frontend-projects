<html>
    <head>
        <title>Google-clone</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="logo.png">
    </head>
    <body>
        <div class="main-content">
            <div class="top-content">
                <div class="a">Gmail</div>
                <div class="a">Images</div>
                <div class="a">Menu</div>
                <div class="a-p">
                 <img src="https://images.pexels.com/photos/5323029/pexels-photo-5323029.jpeg?auto=compress&cs=tinysrgb&w=600&lazy=load">
                </div>
            </div>
            <div class="middle-content">
                <div class="container">
                    <div class="logo">
                        <img src="logo.png">
                    </div>
                    <div class="search-box">
                        <img src="search.png" class="search-icon">
                        <input type="text" placeholder="Searh whatever you want?">
                        <img src="mic.png" class="mic">
                        <img src="cam.png" class="cam">
                    </div>
                    <div class="buttons">
                        <div class="b">Google search</div>
                        <div class="b">I'm Feeling lucky</div>
                    </div>
                    <div class="lang-box">
                        <div class="lan">Google offered in:</div>
                        <div class="lan"><a href="">English</a></div>
                        <div class="lan"><a href="">اردو</a></div>
                        <div class="lan"><a href="">हिन्दी</a></div>
                        <div class="lan"><a href="">ਪੰਜਾਬੀ</a></div>
                        <div class="lan"><a href="">മലയാളം</a></div>
                        <div class="lan"><a href="">தமிழ்</a></div>
                        <div class="lan"><a href="">తెలుగు</a></div>
                    </div>
                </div>
            </div>
            <div class="bottom-content">
                <div class="bottom-up">
                    <div class="d">India</div>
                </div>
                <div class="bottom-down">
                    <div class="bottom-down-left">
                        <div class="d">About</div>
                        <div class="d">Advertising</div>
                        <div class="d">Business</div>
                        <div class="d">How search works</div>
                    </div>
                    <div class="bottom-down-right">
                        <div class="d">Privacy</div>
                        <div class="d">Terms</div>
                        <div class="d">Settings</div>
                    </div>
                </div>
            </div>
        </div>    
    </body>
</html>
